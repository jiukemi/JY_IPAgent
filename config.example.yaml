# Copy to config.yaml and adjust paths.

hf_endpoint: "https://hf-mirror.com"

paths:
  ffmpeg: "ffmpeg"
  latentsync_dir: "tools/LatentSync"
  sadtalker_dir: "tools/SadTalker"
  indextts_dir: "tools/IndexTTS"
  cosyvoice_dir: "tools/CosyVoice/CosyVoice"
  piper_dir: "tools/Piper"
  whisper_dir: "tools/Whisper"
  funasr_dir: "tools/FunASR"
  qwen3_local_dir: "tools/Qwen3-TTS"

deployment:
  mode: local
  steps:
    script: local
    tts: local
    avatar: local
    publish: local
  cloud:
    script_provider: parse_api
    tts_provider: qwen3_tts
    avatar_provider: volcengine
    publish_provider: volcengine
  engines:
    script:
      local: funasr
      cloud: cloud_17zhiling
    tts:
      local: indextts
      cloud: qwen3_tts
    avatar:
      local: heygem
      cloud: volcengine
    publish:
      local: ffmpeg
      cloud: volcengine

script:
  extract_backend: whisper
  whisper_model: small
  funasr_model: sensevoice
  language: zh
  funasr:
    worker_enabled: false      # 常驻 worker：开 → 提速 3-5 倍，约占 500MB 内存
  rewrite_intensity: medium
  cloud:
    download_cdn: true
    # ①-A CDN：分享链接 → 无水印直链 + 本地预览（去水印类 API）
    # 浏览器登录态（绕开抖音风控；需 pip install playwright && playwright install chromium）
    browser:
      user_data_dir: "data/browser/douyin"
      channel: "chrome"   # 本机 Chrome；空则用 Playwright Chromium（抖音易白屏）
    cdn:
      # 协议：none | cdn_form_key_url | cdn_form_key_url_times | cdn_agg_video | cdn_agg_profile | cdn_json_url
      provider: "none"
      fallback_provider: ""
      api_url: ""
      api_key: ""
      # cdn_agg_* 使用 Authorization: Bearer <api_key>
      # 默认：cdn_agg_video → https://gateway.diadi.cn/api/parse
      #       cdn_agg_profile → https://gateway.diadi.cn/api/parse/user（取 list 首条）
    # ①-B ASR：asr_sync_videourl | asr_async_time | asr_async_count | asr_sync_content | asr_custom_json
    transcript:
      provider: "asr_async_time"
      api_url: ""
      api_key: ""
      # async_timeout_sec: 300   # 异步轮询最长等待（秒）
    parse_api_header: "Authorization"
    parse_timeout_sec: 120
    asr_async_timeout_sec: 300
    ui_preview_clip_sec: 90      # 页面只播本地短预览；完整文件下载后仅用于 ASR（0=播完整本地文件）
    ui_preview_max_mb: 30        # 超过此大小也会截取预览片段
    # 旧字段（兼容）：parse_provider / parse_api_key 会映射到上面两块
    rewrite:
      base_url: "https://api.deepseek.com/v1"
      api_key: ""
      model: "deepseek-chat"   # 新版模型发布后改 model 即可（如 deepseek-v3 等）
      timeout_sec: 120
    legal:
      base_url: ""
      api_key: ""
      model: ""
      timeout_sec: 120

qwen3_tts:
  api_key: ""
  model: "qwen3-tts-flash"
  base_url: "https://dashscope.aliyuncs.com/api/v1"

qwen3_local:
  size: "0.6B"                 # 0.6B ≈4GB+ VRAM；1.7B ≈8GB+（需重新跑 scripts/setup/setup_qwen3_local.ps1 -Size 1.7B）
  device: "cuda:0"
  dtype: "bfloat16"
  attn_implementation: "sdpa"
  default_speaker: "Vivian"

tts:
  backend: "indextts"
  default_speed: "balanced"
  edge_voice: "zh-CN-XiaoxiaoNeural"

indextts:
  model_dir: "checkpoints"
  worker_enabled: true          # 配音时用常驻进程（首次合成会加载到 GPU）
  worker_autostart: false       # true=打开软件就占 GPU；默认 false，避免「没操作却爆显存」
  use_fp16: true
  use_emo_text: true
  clone_use_emo_text: true   # 克隆音色填写「情感风格」时叠加 emo_text
  clone_emo_alpha: 0.28     # 0.2~0.35 更稳、少错词；0.45+ 情感更明显但易夸张
  max_text_tokens_per_segment: 120
  interval_silence: 200
  temperature: 0.8
  top_p: 0.8
  top_k: 30
  default_spk_wav: "checkpoints/examples/voice_01.wav"

cosyvoice:
  model_dir: "pretrained_models/CosyVoice2-0.5B"
  default_sft_speaker: "中文女"
  speed: 1.0

piper:
  model: "tools/Piper/zh_CN-huayan-medium.onnx"

lipsync:
  backend: "latentsync"
  digital_backend: "heygem"
  real_backend: "latentsync"
  fps: 25
  default_quality: "natural"
  quality_presets:
    fast:
      inference_steps: 12
      guidance_scale: 1.0
      deepcache_interval: 4
    natural:
      inference_steps: 20
      guidance_scale: 1.0
      deepcache_interval: 3
    balanced:
      inference_steps: 20
      guidance_scale: 1.3
      deepcache_interval: 3
    accurate:
      inference_steps: 28
      guidance_scale: 1.5
      deepcache_interval: 3

latentsync:
  checkpoint: "checkpoints/latentsync_unet.pt"
  unet_config: "configs/unet/stage2_512.yaml"
  inference_steps: 20
  guidance_scale: 1.0
  enable_deepcache: true
  deepcache_interval: 3
  seed: 1247

heygem:
  video_api: "http://127.0.0.1:8383"
  voice_api: "http://127.0.0.1:18180"
  data_mount_host: "E:/agent/data/heygem_face2face"
  data_mount_container: "/code/data"
  poll_interval_sec: 2
  timeout_sec: 3600
  chaofen: 0
  watermark_switch: 0
  pn: 1

sadtalker:
  preprocess: "full"
  still: false
  size: 256
  batch_size: 2
  expression_scale: 1.0
  pose_style: 0
  ref_pose: ""
  enhancer: "gfpgan"

publish:
  subtitle_max_chars: 12
  subtitle_pause_sec: 0.35
  subtitle_font_size: 34
  subtitle_style: "bottom_white"
  cover_template: "classic_bottom"
  embed_cover: true
  burn_subtitles: true
  pip_position: "top_right"
  pip_scale: 0.28
  pip_margin: 24

output:
  dir: "./output"
